name: Web Serial settings

on:
  pull_request:
    paths:
      - 'esp32/tools/muse/serial_*'
      - '.github/workflows/web-serial.yml'
  push:
    branches: [main]
    paths:
      - 'esp32/tools/muse/serial_*'
      - '.github/workflows/web-serial.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test settings protocol and complete status
        run: node --test esp32/tools/muse/serial_settings.test.mjs esp32/tools/muse/serial_status.test.mjs
